name: Deploy Astro site to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "emdash-site/**"
      - ".github/workflows/deploy-astro.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-astro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: emdash-site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMDASH_ENCRYPTION_KEY: ${{ secrets.EMDASH_ENCRYPTION_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: emdash-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm run build

      - name: Deploy Worker
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          secrets_file="$RUNNER_TEMP/emdash-worker-secrets.env"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'EMDASH_ENCRYPTION_KEY=%s\n' "$EMDASH_ENCRYPTION_KEY" > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
